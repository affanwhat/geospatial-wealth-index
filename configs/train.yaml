# Training on the real dataset (produced by the Phase 2 feature build + Podes labels).
data:
  path: data/processed/dataset.csv
  sep: ","
  id_col: id
  target_col: wealth_index
  coord_cols: [lon, lat]

split:
  scheme: spatial        # spatial | random
  test_size: 0.3         # fraction of spatial blocks for the spatial scheme
  block_size_km: 5.0
  cv_folds: 5

features:
  texture_pca: 0.95      # PCA over the TEX_* columns, fit per training fold (thesis: 95%); null disables
  corr_threshold: 0.95   # null disables the filter
  top_k: 25
  pfi_repeats: 5
  pfi_estimators: 100

search:
  method: random         # random | tpot (pip install -e ".[tpot]")
  n_iter: 30             # random search only
  scoring: neg_root_mean_squared_error
  tpot:                  # used when method: tpot; defaults mirror the thesis run
    search_space: rf     # rf = RandomForest over the model__* grid below; or linear-light | linear | graph
    generations: 10
    population_size: 50
    early_stop: null
    max_time_mins: 60
  param_distributions:   # RF grid from the thesis (Lampiran 3), plus the number of selected features
    select__top_k: [15, 25, 40]
    model__n_estimators: [50, 100, 200]
    model__max_depth: [10, 20, 30]
    model__min_samples_split: [10, 15, 20, 30]
    model__min_samples_leaf: [4, 6, 8, 10, 15, 20]
    model__max_features: [sqrt]

seed: 42
n_jobs: -1
output_dir: artifacts
